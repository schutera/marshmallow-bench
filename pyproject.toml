[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "marshmallow-bench"
version = "1.0.0"
description = "A two-probe diagnostic for language model controllability"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [
    { name = "Mark Schutera" },
]
keywords = ["llm", "benchmark", "controllability", "alignment", "evaluation"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "httpx>=0.27",
    "pydantic>=2.0",
    "tenacity>=8.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "respx>=0.21"]

[project.scripts]
marshmallow-bench = "marshmallow_bench.cli:main"

[project.urls]
Repository = "https://github.com/schutera/marshmallow-bench"
Paper = "https://arxiv.org/abs/XXXX.XXXXX"
